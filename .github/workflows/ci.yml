name: CI Pipeline

on:
  push:
    branches: [ main, 'feature/**' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Backend (Spring Boot & PostgreSQL)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: groomai_test
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21 (Eclipse Temurin)
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Grant Execute Permission to Maven Wrapper
        run: chmod +x mvnw

      - name: Run Backend Verification & Integration Tests
        env:
          DB_URL: jdbc:postgresql://localhost:5432/groomai_test
          DB_USERNAME: test_user
          DB_PASSWORD: test_password
        run: ./mvnw -B clean verify

      - name: Publish Test Summary
        if: always()
        run: |
          echo "### Backend Test Results" >> $GITHUB_STEP_SUMMARY
          for f in target/surefire-reports/*.txt; do
            echo "#### $(basename "$f")" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            cat "$f" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          done

  mobile:
    name: Mobile (React Native Expo & TypeScript)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Run TypeScript Strict Check
        run: npm run type-check

      - name: Run Mobile Unit Tests
        run: npm test

      - name: Run Expo Bundle Verification
        env:
          EXPO_NO_TELEMETRY: '1'
        run: npx expo export --output-dir /tmp/expo-ci-test

      - name: Publish Mobile Build Summary
        if: always()
        run: |
          echo "### Mobile Build & Check Results" >> $GITHUB_STEP_SUMMARY
          echo "- **TypeScript Strict Check**: PASSED (\`tsc --noEmit\` exit code 0)" >> $GITHUB_STEP_SUMMARY
          echo "- **Expo iOS & Android Export**: PASSED (\`npx expo export\` exit code 0)" >> $GITHUB_STEP_SUMMARY
